---
# tasks file for nginx_role
# This role installs and starts Nginx on a Debian/Ubuntu server.
# Each task is simple and easy to understand for learning.

- name: Install nginx package
  ansible.builtin.apt:
    name: nginx
    state: present
    update_cache: true

- name: Start nginx service
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
